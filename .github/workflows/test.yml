name: Test libpcap.c3l

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-13
          - macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C3
        shell: bash
        run: |
          set -e

          C3_VERSION=0.8.2

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            curl -fL \
              "https://github.com/c3lang/c3c/releases/download/v${C3_VERSION}/c3-macos.zip" \
              -o c3.zip

            unzip -q c3.zip -d "$HOME"

            chmod +x "$HOME/c3/c3c"

            echo "$HOME/c3" >> "$GITHUB_PATH"

            xattr -d com.apple.quarantine "$HOME/c3/c3c" || true

          else
            curl -fL \
              "https://github.com/c3lang/c3c/releases/download/v${C3_VERSION}/c3-linux-static.tar.gz" \
              -o c3.tar.gz

            mkdir -p "$HOME/c3"
            tar -xzf c3.tar.gz -C "$HOME"

            chmod +x "$HOME/c3/c3c"

            echo "$HOME/c3" >> "$GITHUB_PATH"
          fi

      - name: Check C3
        run: |
          c3c --version

      - name: Install libpcap
        shell: bash
        run: |
          set -e

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install libpcap

            echo "LIBRARY_PATH=$(brew --prefix libpcap)/lib" >> "$GITHUB_ENV"
            echo "CPATH=$(brew --prefix libpcap)/include" >> "$GITHUB_ENV"

          else
            sudo apt-get update
            sudo apt-get install -y libpcap-dev
          fi

      - name: Install c3l
        shell: bash
        run: |
          set -e

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install bash gnu-sed

            echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          fi

          git clone https://github.com/konimarti/c3l.git
          cd c3l

          make
          sudo make install

      - name: Check tools
        shell: bash
        run: |
          echo "Bash:"
          bash --version

          echo "sed:"
          sed --version

          echo "c3l:"
          which c3l
          head -n 1 "$(which c3l)"

      - name: Create test project
        shell: bash
        run: |
          set -e

          c3c init test_project

      - name: Fetch libpcap.c3l
        shell: bash
        working-directory: test_project
        run: |
          set -e

          pwd
          ls -la

          c3l fetch https://github.com/vamsi200/libpcap.c3l

      - name: Create consumer
        shell: bash
        working-directory: test_project
        run: |
          set -e

          cat > src/main.c3 <<'EOF'
          import libpcap;
          import std::io;

          fn void main()
          {
              Pcap_if_t* alldevs;
              char[256] errbuf;

              int ret = pcap::pcap_findalldevs(&alldevs, &errbuf);

              if (ret != 0) return;

              pcap::pcap_freealldevs(alldevs);
          }
          EOF

      - name: Build
        shell: bash
        working-directory: test_project
        run: |
          set -e

          c3c build

      - name: Run
        shell: bash
        working-directory: test_project
        run: |
          set -e

          ./build/test_project
